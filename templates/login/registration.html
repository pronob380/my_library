<!DOCTYPE html>
{% load static %}
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Register - SB Admin</title>
        <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Create Account</h3></div>
                                    <div class="card-body">
                                        <!-- registration.html -->
                                        <form method="post" action="{% url 'register' %}"  enctype="multipart/form-data">
                                            {% csrf_token %}
                                            
                                            {% if error %}
                                                <div class="alert alert-danger">
                                                    {{ error }}
                                                </div>
                                            {% endif %}
                                            
                                            <div class="form-group">
                                                <label for="email">Email address</label>
                                                <input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="name">Full Name</label>
                                                <input class="form-control" id="name" name="name" type="text" placeholder="Enter your full name">
                                            </div>
                                            <div class="form-group">
                                                <label for="roll">Roll Number</label>
                                                <input class="form-control" id="roll" name="roll" type="text" placeholder="Enter your roll number">
                                            </div>
                                            <div class="form-group">
                                                <label for="department">Department</label>
                                                <input class="form-control" id="department" name="department" type="text" placeholder="Enter your department">
                                            </div>
                                            <div class="form-group">
                                                <label for="session">Session</label>
                                                <input class="form-control" id="session" name="session" type="text" placeholder="Enter your session">
                                            </div>
                                            <div class="form-group">
                                                <label for="phone_number">Phone Number</label>
                                                <input class="form-control" id="phone_number" name="phone_number" type="tel" placeholder="Enter your phone number">
                                            </div>
                                            <div class="form-group">
                                                <label for="address">Address</label>
                                                <textarea class="form-control" id="address" name="address" placeholder="Enter your address"></textarea>
                                            </div>
                                            <div class="form-group">
                                                <label for="image">Upload your image</label>
                                                <input class="form-control" id="image" name="image" type="file">
                                            </div>
                                            <div class="form-group">
                                                <label for="password">Password</label>
                                                <input class="form-control" id="password" name="password" type="password" placeholder="Create a password" required>
                                            </div>
                                            <div class="form-group">
                                                <label for="password_confirm">Confirm Password</label>
                                                <input class="form-control" id="password_confirm" name="password_confirm" type="password" placeholder="Confirm your password" required>
                                            </div>
                                            <button type="submit" class="btn btn-primary">Register</button>
                                        </form>


                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"><a href="{% url 'login_view' %}">Have an account? Go to login</a></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Your Website 2023</div>
                            <div>
                                <a href="#">Privacy Policy</a>
                                &middot;
                                <a href="#">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
          <script src="{% static 'js/scripts.js' %}"></script>
    </body>
</html>
