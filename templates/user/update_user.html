{% extends "base.html" %}
{% block content %}
    <main>
        <div class="container-fluid px-4">
            <div class="card mb-4 mt-5">
                <div class="card-body">
                    <h2>User Update</h2>
                    
                    <form method="post" action="{% url 'update_user' user.id %}" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="form-group mt-3">
                            <label for="name">Name</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="email">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="roll">Roll</label>
                            <input type="number" class="form-control" id="roll" name="roll" value="{{ user.roll }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="department">Department</label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ user.department }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="session">Session</label>
                            <input type="text" class="form-control" id="session" name="session" value="{{ user.session }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="phone_number">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ user.phone_number }}" required>
                        </div>
                        <div class="form-group mt-3">
                            <label for="address">Address</label>
                            <textarea class="form-control" id="address" name="address" rows="3" required>{{ user.address }}</textarea>
                        </div>
                        <div class="form-group mt-3">
                            <label for="user_type">User Type</label>
                            <select class="form-control" id="user_type" name="user_type" required>
                                <option value="MEM" {% if user.user_type == 'MEM' %}selected{% endif %}>Member</option>
                                <option value="LIB" {% if user.user_type == 'LIB' %}selected{% endif %}>Librarian</option>
                                <option value="ADM" {% if user.user_type == 'ADM' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="form-group mt-3">
                            <label for="image">Profile Image</label><br>
                            <input type="file" class="form-control-file" id="image" name="image">
                            <small class="form-text text-muted">Leave empty to keep the current image.</small>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">Update User</button>
                    </form>
                </div>
            </div>
            <div style="height: 100vh"></div>
            <div class="card mb-4">
                <div class="card-body">When scrolling, the navigation stays at the top of the page. This is the end of the static navigation demo.</div>
            </div>
        </div>
    </main>
{% endblock content %}
