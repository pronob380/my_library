{% extends "base.html" %}
{% block content %}
<main>
    <div class="container-fluid px-4">
        <div class="card mb-4 mt-5">
            <div class="card-body">
                <h2>Update Book</h2>
                <form method="post" action="{% url 'update_book' book.id %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group mt-3">
                        <label for="title">Title</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="author">Author</label>
                        <input type="text" class="form-control" id="author" name="author" value="{{ book.author.name }}" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="isbn">ISBN</label>
                        <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn }}" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="published_date">Published Date</label>
                        <input type="date" class="form-control" id="published_date" name="published_date" value="{{ book.published_date }}" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="available_copies">Available Copies</label>
                        <input type="number" class="form-control" id="available_copies" name="available_copies" value="{{ book.available_copies }}" required>
                    </div>
                    <div class="form-group mt-3">
                        <label for="description">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" required>{{ book.description }}</textarea>
                    </div>
                    <div class="form-group mt-3">
                        <label for="image">Image</label><br>
                        <input type="file" class="form-control-file" id="image" name="image">
                    </div>
                    <button type="submit" class="btn btn-primary mt-3">Update Book</button>
                </form>
            </div>
        </div>
    </div>
</main>
{% endblock content %}
